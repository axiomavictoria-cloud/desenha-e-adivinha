<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desenha & Adivinha</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><img class="brand-logo" src="/logo.svg" alt="Logo da marca"><div><h1>Desenha <span>&</span> Adivinha</h1><p>Uma palavra, um desenho e muitos palpites!</p></div></header>
<section id="home" class="panel"><div class="tabs"><button class="tab active" data-tab="create">Criar sala</button><button class="tab" data-tab="join">Entrar na sala</button></div>
<div id="createPane"><label>Seu apelido</label><input id="hostName" maxlength="24" placeholder="Ex.: Rafa"><label>Suas palavras <small>(uma por linha; mínimo 9, recomendamos 15)</small></label><textarea id="words" rows="7" placeholder="Abacaxi&#10;Avião&#10;Dinossauro&#10;Praia&#10;..."></textarea><button id="createBtn" class="primary">Criar minha sala</button></div>
<div id="joinPane" hidden><label>Seu apelido</label><input id="playerName" maxlength="24" placeholder="Ex.: Bia"><label>Código da sala</label><input id="roomCode" maxlength="6" placeholder="ABC123"><button id="joinBtn" class="primary">Entrar e jogar</button></div><p id="homeError" class="error"></p></section>
<section id="game" hidden><div class="topline"><div>SALA <b id="codeLabel"></b> <button id="copyBtn" class="tiny">Copiar convite</button></div><div id="phaseLabel">Aguardando jogadores</div></div>
<div class="layout"><section class="panel play"><div class="roundbar"><span id="roundLabel">Preparando</span><strong id="timer">--:--</strong></div><div id="wordHint" class="hint">O sorteio do desenhista acontece a cada rodada.</div><canvas id="board" width="900" height="520"></canvas>
<div id="tools" class="tools" hidden><label>Cor <input type="color" id="color" value="#20243a"></label><label>Traço <input type="range" id="width" min="2" max="24" value="6"></label><button id="erase" class="tiny">Borracha</button><button id="clear" class="tiny">Limpar</button></div>
<div id="guessArea" class="guess"><input id="guessInput" placeholder="Digite seu palpite..." maxlength="24"><button id="guessBtn" class="primary">Enviar</button></div><p id="notice" class="notice">Aguardando o anfitrião iniciar a partida.</p></section>
<aside class="side"><section class="panel"><h2>Jogadores <span id="count">0/35</span></h2><div id="players" class="players"></div><button id="startBtn" class="primary" hidden>Iniciar 9 rodadas</button></section><section class="panel"><h2>Chat de palpites</h2><div id="chat" class="chat"></div></section></aside></div>
<section id="results" class="panel" hidden><h2>🏆 Resultado final</h2><div id="ranking"></div><button class="primary" onclick="location.reload()">Voltar ao início</button></section></section>
</main><div id="toast" class="toast"></div><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
